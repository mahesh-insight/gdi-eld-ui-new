<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Storage - Azure Invoice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .danger {
            background-color: #dc3545;
        }
        .danger:hover {
            background-color: #c82333;
        }
        .success {
            background-color: #28a745;
        }
        .message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .message.show {
            display: block;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>🧹 Clear Storage</h1>
    <p>If you're experiencing errors with the Azure Invoice dashboard, click the button below to clear all cached data.</p>
    
    <div id="message" class="message"></div>
    
    <button onclick="clearReduxPersist()">Clear Redux Persist Data Only</button>
    <button class="danger" onclick="clearAllStorage()">Clear ALL Storage (Nuclear Option)</button>
    <button class="success" onclick="goBack()">Go Back to Dashboard</button>
    
    <script>
        function showMessage(text, type = 'success') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type} show`;
            setTimeout(() => {
                msg.className = 'message';
            }, 5000);
        }
        
        function clearReduxPersist() {
            try {
                localStorage.removeItem('persist:ccr-auth');
                localStorage.removeItem('persist:ccr-azure-invoice');
                localStorage.removeItem('persist:ccr-dashboard');
                showMessage('✅ Redux Persist data cleared successfully! Please refresh the dashboard.', 'success');
            } catch (error) {
                showMessage('❌ Error clearing data: ' + error.message, 'error');
            }
        }
        
        function clearAllStorage() {
            if (confirm('⚠️ This will clear ALL localStorage data. Are you sure?')) {
                try {
                    localStorage.clear();
                    sessionStorage.clear();
                    showMessage('✅ All storage cleared successfully! Please refresh the dashboard.', 'success');
                } catch (error) {
                    showMessage('❌ Error clearing storage: ' + error.message, 'error');
                }
            }
        }
        
        function goBack() {
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
