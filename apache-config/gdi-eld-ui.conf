# Apache Virtual Host Configuration for GDI ELD UI
# Next.js Reverse Proxy Setup

<VirtualHost *:80>
    ServerName gdi-eld-ui.insight.com
    ServerAdmin mkotapal@insight.com
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/gdi-eld-ui-error.log
    CustomLog ${APACHE_LOG_DIR}/gdi-eld-ui-access.log combined
    
    # Security Headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Proxy Configuration
    ProxyPreserveHost On
    ProxyTimeout 300
    
    # Proxy all requests to Next.js Node.js server
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/
    
    # WebSocket support (if needed in future)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)  ws://localhost:3000/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)  http://localhost:3000/$1 [P,L]
    
    # Enable compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>
    
    # Cache static assets
    <Location "/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>
</VirtualHost>

# HTTPS Configuration (Recommended for production)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName gdi-eld-ui.insight.com
    ServerAdmin mkotapal@insight.com
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/gdi-eld-ui.crt
    SSLCertificateKeyFile /etc/ssl/private/gdi-eld-ui.key
    SSLCertificateChainFile /etc/ssl/certs/gdi-eld-ui-chain.crt
    
    # Modern SSL Configuration
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off
    
    # HSTS (optional but recommended)
    Header always set Strict-Transport-Security "max-age=63072000"
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/gdi-eld-ui-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/gdi-eld-ui-ssl-access.log combined
    
    # Security Headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Proxy Configuration
    ProxyPreserveHost On
    ProxyTimeout 300
    
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/
    
    # WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)  ws://localhost:3000/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)  http://localhost:3000/$1 [P,L]
    
    # Enable compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>
    
    # Cache static assets
    <Location "/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>
</VirtualHost>
</IfModule>
